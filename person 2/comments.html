<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Campus Feed - Comments</title>
<link rel="stylesheet" href="person2.css">
</head>
<body>
<div class="page">
<header class="topbar">
<button class="back-btn" onclick="history.back()">←</button>
<h1>Comments & Evidence</h1><div></div>
</header>
<main class="container">
<div id="commentIssueSummary" class="issue-summary"></div>
<div id="commentsList" class="comments-list"></div>
<div class="comment-box">
<textarea id="commentInput" rows="3" maxlength="300" placeholder="Add a comment anonymously..."></textarea>
<button class="primary-btn" onclick="addComment()">Post Comment</button>
</div>
</main>
</div>
<script src="person2.js"></script>
</body>
</html>
