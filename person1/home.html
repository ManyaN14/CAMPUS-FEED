<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Campus Feed</title>
  <link rel="stylesheet" href="../css/global.css">
</head>

<body>

<div class="app-shell">

<header class="topbar">

  <div class="container topbar-inner">

    <a class="brand" href="home.html">
      <span class="brand-mark">CF</span>
      <span>Campus Feed</span>
    </a>

    <nav class="nav">
      <a class="active" href="home.html">Campus Feed</a>
      <a href="../person2/report.html">Report Issue</a>
      <a href="../person3/reports.html">My Reports</a>
      <a href="../person3/monthly-report.html">Insights</a>
    </nav>

    <a class="profile-chip" href="../person3/profile.html">
      <span class="avatar">C</span>
      <span id="navName">CampusExplorer</span>
    </a>

  </div>

</header>

<main class="page container">

  <div class="page-head">

    <div>
      <span class="eyebrow">IGDTUW COMMUNITY</span>

      <h1>What needs attention?</h1>

      <p class="muted">
        One place for students to raise, support
        and track campus issues.
      </p>
    </div>

    <a
      class="btn btn-primary"
      href="../person2/report.html"
    >
      ＋ Report an issue
    </a>

  </div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">

    <input
      id="search"
      class="search"
      placeholder="Search issues, locations..."
    >

    <select id="category" class="select">
      <option value="">All categories</option>
      <option>Infrastructure</option>
      <option>Safety Hazard</option>
      <option>Cleanliness</option>
      <option>Hostel</option>
      <option>Water</option>
      <option>Electricity</option>
      <option>Mess</option>
    </select>

    <select id="status" class="select">
      <option value="">All statuses</option>
      <option>Active</option>
      <option>Resolved</option>
      <option>Community Verified</option>
    </select>

  </div>

  <div id="feed" class="issue-grid"></div>

</main>

<footer class="footer-inner">
  Campus Feed · Verified students · Anonymous identity · Community powered
</footer>

</div>

<script src="../js/storage.js"></script>
<script src="home.js"></script>

</body>
</html>
