<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reports - Campus Feed</title>

    <!-- GLOBAL CSS -->
    <link rel="stylesheet" href="../css/global.css">

    <!-- PERSON 3 CSS -->
    <link rel="stylesheet" href="person3.css">

</head>

<body>

<header class="navbar">

    <div class="navbar-inner">

        <a href="../index.html" class="logo">
            Campus Feed
        </a>

        <nav class="nav-links">

            <a href="../index.html">
                Home
            </a>

            <a href="../person2/report.html">
                Report Issue
            </a>

            <a href="reports.html">
                Reports
            </a>

            <a href="monthly-report.html">
                Monthly Report
            </a>

            <a href="profile.html">
                Profile
            </a>

        </nav>

    </div>

</header>


<main>

    <div class="container">

        <div class="page-header">

            <h1>Reports Dashboard</h1>

            <p>
                Overview of issues reported by students.
            </p>

        </div>


        <!-- STATISTICS -->

        <section class="grid grid-4">

            <div class="stat-card">

                <h3>Total Issues</h3>

                <div
                    class="stat-number"
                    id="totalIssues">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Active Issues</h3>

                <div
                    class="stat-number"
                    id="activeIssues">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Resolved Issues</h3>

                <div
                    class="stat-number"
                    id="resolvedIssues">
                    0
                </div>

            </div>


            <div class="stat-card">

                <h3>Total Support</h3>

                <div
                    class="stat-number"
                    id="totalSupport">
                    0
                </div>

            </div>

        </section>


        <br>


        <!-- MOST SUPPORTED -->

        <section class="card">

            <h2>Most Supported Issues</h2>

            <br>

            <div id="topIssues"></div>

        </section>


        <br>


        <!-- CATEGORY -->

        <section class="card">

            <h2>Issues by Category</h2>

            <br>

            <div id="categoryStats"></div>

        </section>

    </div>

</main>


<footer class="footer">

    <p>
        Campus Feed © 2026
    </p>

</footer>


<!-- SHARED STORAGE MUST COME FIRST -->

<script src="../js/storage.js"></script>

<!-- PERSON 3 JS -->

<script src="person3.js"></script>

</body>

</html>
