<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Campus Feed - Profile</title>

    <link rel="stylesheet" href="person3.css">

</head>


<body>


<header class="topbar">

    <a href="../index.html" class="brand">
        Campus Feed
    </a>


    <nav>

        <a href="reports.html">
            Reports
        </a>

        <a href="monthly-report.html">
            Monthly Report
        </a>

        <a href="profile.html" class="active">
            Profile
        </a>

    </nav>

</header>



<main class="container">


    <!-- Profile header -->

    <section class="profile-hero panel">

        <div
            class="avatar"
            id="avatar">

            CF

        </div>


        <div>

            <p class="eyebrow">
                STUDENT PROFILE
            </p>

            <h1 id="profileName">
                Student
            </h1>

            <p id="profileEmail">
                student@college.edu
            </p>

        </div>

    </section>



    <!-- Profile statistics -->

    <section
        id="profileStats"
        class="stats-grid">

    </section>



    <!-- Reported and supported -->

    <section class="two-column">


        <div class="panel">

            <h2>
                My Reported Issues
            </h2>

            <div
                id="reportedIssues"
                class="activity-list">

            </div>

        </div>



        <div class="panel">

            <h2>
                Issues I Supported
            </h2>

            <div
                id="supportedIssues"
                class="activity-list">

            </div>

        </div>


    </section>



    <!-- Comments -->

    <section class="panel">

        <h2>
            Recent Comments
        </h2>

        <div
            id="recentComments"
            class="activity-list">

        </div>

    </section>


</main>


<script src="person3.js"></script>

</body>

</html>
