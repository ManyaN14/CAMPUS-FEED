<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Campus Feed - Monthly Report</title>

  <link rel="stylesheet" href="person3.css">

</head>


<body>

  <header class="topbar">

    <a class="brand" href="../index.html">
      Campus Feed
    </a>

    <nav>

      <a href="reports.html">
        Reports
      </a>

      <a href="monthly-report.html"
         class="active">
        Monthly Report
      </a>

      <a href="profile.html">
        Profile
      </a>

    </nav>

  </header>


  <main class="container">


    <section class="page-heading">

      <div>

        <p class="eyebrow">
          MONTHLY OVERVIEW
        </p>

        <h1>
          Campus Monthly Report
        </h1>

        <p>
          A quick summary of campus feedback and issue activity.
        </p>

      </div>


      <button
        class="outline-btn"
        onclick="window.print()">

        Print Report

      </button>

    </section>


    <!-- Monthly Statistics -->

    <section
      id="monthlySummary"
      class="stats-grid">
    </section>


    <!-- Top issue and category -->

    <section class="two-column">


      <div class="panel">

        <h2>
          Top Issue
        </h2>

        <div id="monthlyTopIssue"></div>

      </div>


      <div class="panel">

        <h2>
          Most Reported Category
        </h2>

        <div id="monthlyTopCategory"></div>

      </div>


    </section>


    <!-- Category breakdown -->

    <section class="panel">

      <div class="panel-heading">

        <h2>
          Category Breakdown
        </h2>

      </div>

      <div
        id="monthlyCategories"
        class="bars">
      </div>

    </section>


  </main>


  <script src="person3.js"></script>

</body>

</html>
